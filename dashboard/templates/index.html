<!DOCTYPE html>
<html>
<head>
    <title>Test Dashboard</title>

    <!-- 🔄 Auto refresh every 60 seconds -->
    <meta http-equiv="refresh" content="60">

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        #loader {
            display: none;
            font-size: 20px;
            color: red;
            font-weight: bold;
        }

        pre {
            text-align: left;
            background: #111;
            color: #0f0;
            padding: 10px;
            max-height: 300px;
            overflow-y: scroll;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>

    <script>
        function checkStatus() {
            fetch('/status')
                .then(res => res.json())
                .then(data => {
                    const loader = document.getElementById("loader");
                    const button = document.getElementById("runBtn");

                    if (data.running) {
                        loader.style.display = "block";
                        button.disabled = true;
                        loadLogs(); // live logs while running
                    } else {
                        loader.style.display = "none";
                        button.disabled = false;
                    }
                });
        }

        function loadLogs() {
            fetch('/logs')
                .then(res => res.json())
                .then(data => {
                    document.getElementById("logs").innerText = data.logs;
                });
        }

        // check every 2 seconds
        setInterval(checkStatus, 2000);

        // load logs on page load
        window.onload = loadLogs;
    </script>
</head>

<body>

    <h1>🧪 Intelligent Test Dashboard</h1>

    <h2>📊 Results</h2>
    <p>✅ Passed: {{ passed }}</p>
    <p>❌ Failed: {{ failed }}</p>
    <p>⚠️ Flaky: {{ flaky }}</p>

    <br>

    <a href="/run">
        <button id="runBtn">🚀 Run Tests</button>
    </a>

    <p id="loader">🔄 Running tests... please wait</p>

    <br><br>

    <h2>📈 Graph</h2>
    <img src="/static/graph.png" width="400">

    <br><br>

    <h2>📜 Raw Test Logs</h2>
    <pre id="logs">Loading logs...</pre>

</body>
</html>
